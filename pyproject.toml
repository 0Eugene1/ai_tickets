[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-assistant"
version = "0.1.0"
description = "MVP assistant for internal CallCenter ticket triage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[project.scripts]
ticket-assistant-load-telegram = "app.knowledge.telegram_loader:main"
ticket-assistant-extract-telegram = "app.knowledge.telegram_candidates:main"
ticket-assistant-load-confluence = "app.knowledge.confluence_loader:main"
ticket-assistant-extract-confluence = "app.knowledge.confluence_candidates:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
