services:
  ticket-assistant:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/runtime/ticket_assistant.db
      KNOWLEDGE_PATH: /app/data/knowledge
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost}
    volumes:
      - ticket-assistant-runtime:/app/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ticket-assistant-runtime:
